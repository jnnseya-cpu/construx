# Local parity with the deployed container, and a self-hosted option.
#
# The volume is the point. Without it the container is writable and ephemeral,
# and the record dies with the container — which is exactly the failure the
# journal exists to prevent, reintroduced by the orchestration.

services:
  construx:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      # Bound to the loopback deliberately. Docker publishes ports by writing
      # its own iptables rules, which are evaluated *before* ufw's — so
      # '8080:8080' here would reach the internet on a host whose firewall
      # allows only 80 and 443, and serve the console over plain http beside
      # the https one. A reverse proxy on the same host reaches this fine.
      #
      # The host side is a variable because a VPS is rarely empty. Another
      # application already holding 8080 would stop this container dead on
      # start, and the fix must not be to publish it more widely. Set
      # CONSTRUX_HOST_PORT and point the proxy at that instead; the port
      # inside the container never changes.
      - '127.0.0.1:${CONSTRUX_HOST_PORT:-8080}:8080'
    # Every setting `.env.example` documents, passed through as written.
    #
    # This used to enumerate a dozen variables, which meant the other thirty
    # eight were silently ignored in the only environment that runs in
    # production: a deployment could set NEWSLETTER_FROM_ADDRESS or
    # ACU_MARKUP_MULTIPLIER in .env, see no error, and get the built-in default.
    # `.env` cannot reach the image any other way — .dockerignore excludes it on
    # purpose, so that no published layer ever carries somebody's secrets.
    env_file:
      - .env
    environment:
      # Only what belongs to the container rather than to the deployment. These
      # deliberately override .env, because they name paths inside the image and
      # the port the process binds behind the published one.
      NODE_ENV: production
      PORT: '8080'
      LEDGER_JOURNAL_PATH: /data/ledger.jsonl
      # Never 'false' outside a throwaway environment: it lets the process
      # acknowledge an event that has not reached the disk.
      LEDGER_JOURNAL_FSYNC: 'true'
      # On the same volume as the journal, and for the same reason. Left unset
      # the platform records evidence hashes and holds no files — a chain that
      # lasts exactly as long as whoever took the photograph still has it.
      EVIDENCE_STORE_PATH: /data/evidence
      # Required, and checked here rather than at boot so the failure is "you
      # have not set this" instead of a service that starts and signs tokens
      # anybody could forge.
      GATEWAY_JWT_SECRET: ${GATEWAY_JWT_SECRET:?set GATEWAY_JWT_SECRET before starting}
    volumes:
      - ledger:/data
    restart: unless-stopped
    # Long enough for a journal replay on a large record; the readiness probe
    # is what decides when traffic may arrive.
    stop_grace_period: 30s

volumes:
  ledger:
