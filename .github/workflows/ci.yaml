# Typecheck and the full suite on every push and pull request.
#
# There is nothing to build, so there is no build step to test — what CI checks
# is what the reviewer cannot: that the suite passes from a clean checkout with
# no leftover state, and from a working directory CI chose rather than the one a
# developer happened to be in. Two tests used to hold a cwd-relative path and
# passed only because `npm test` ran from the repository root; a CI step is
# exactly what finds that class of defect.

name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # The shared rate limiter runs its bucket arithmetic as a script inside
    # Redis, so it is tested against a real one. Without this the limiter suite
    # skips — loudly, but it still skips, and a security control that is only
    # exercised on a developer's machine is not exercised.
    services:
      redis:
        image: redis:7-alpine
        ports: ['6399:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      # The ledger store and the wire client are tested against a real Postgres
      # 16 for the same reason the limiter is tested against a real Redis: a
      # client proved against a fake proves the fake. `deploy/postgres/
      # client-check.sh` does this on a developer's machine; this is the same
      # two test files against the same schema, on every push.
      postgres:
        image: postgres:16-alpine
        ports: ['55433:5432']
        env:
          POSTGRES_PASSWORD: ci-only-not-a-real-credential
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the engines field and the container base image. Native type
          # stripping is what makes the no-build-step decision work, and it is
          # version-sensitive.
          node-version: '22.18'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
        env:
          TEST_REDIS_URL: redis://127.0.0.1:6399

      # The limiter suite skips rather than fails when no backend is reachable,
      # which is right for a laptop and wrong for CI. This turns a silent skip
      # into a red build.
      - name: Fail if the shared limiter was not exercised
        run: |
          if npm test 2>&1 | grep -q 'SKIPPED: no Redis'; then
            echo "The shared rate limiter was not tested against Redis."
            exit 1
          fi
        env:
          TEST_REDIS_URL: redis://127.0.0.1:6399

      # The schema applied as the cluster owner, the application role given a
      # login for this run only, and the client's and the ledger store's live
      # suites run as that role — so row-level security is exercised as the
      # role that is actually subject to it, exactly as client-check.sh does.
      - name: Apply the ledger schema and run the live Postgres suites
        run: |
          export PGPASSWORD=ci-only-not-a-real-credential
          psql -v ON_ERROR_STOP=1 -q -h 127.0.0.1 -p 55433 -U postgres -d postgres -f deploy/postgres/schema.sql
          psql -v ON_ERROR_STOP=1 -q -h 127.0.0.1 -p 55433 -U postgres -d postgres \
            -c "ALTER ROLE construx_app LOGIN PASSWORD 'ci-only-not-a-real-credential'"
          CONSTRUX_PG_LIVE=1 PGHOST=127.0.0.1 PGPORT=55433 PGDATABASE=postgres \
            node --test backend/tests/postgres.live.test.ts backend/tests/pgstore.live.test.ts

      # Proves the container builds from a clean context and that the
      # .dockerignore has not started excluding something the image needs.
      - name: Build the image
        run: docker build -f deploy/Dockerfile -t construx:ci .

      - name: Boot the image and check readiness
        run: |
          docker run -d --name construx-ci -p 8080:8080 \
            -e GATEWAY_JWT_SECRET=ci-only-not-a-real-secret \
            -e LEDGER_JOURNAL_PATH=/data/ledger.jsonl \
            -e BUILD_COMMIT="$GITHUB_SHA" \
            construx:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/readyz > /dev/null; then
              echo "ready after ${i}s"
              # The demonstration surface must be closed in a production image.
              status=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
                -H 'content-type: application/json' -d '{}' \
                http://localhost:8080/v1/console/session)
              test "$status" = "403" || { echo "console session returned $status, expected 403"; exit 1; }
              # The running commit has to reach `/readyz`, or the question
              # "is the live site on the latest?" has no answer once this is
              # deployed. Checked here because a broken passthrough — compose,
              # env, config or the probe — is invisible until somebody needs it.
              reported=$(curl -fsS http://localhost:8080/readyz | sed -n 's/.*"commit":"\([^"]*\)".*/\1/p')
              test "$reported" = "$GITHUB_SHA" || {
                echo "/readyz reported commit '$reported', expected '$GITHUB_SHA'"; exit 1; }
              curl -fsS http://localhost:8080/ > /dev/null
              docker logs construx-ci
              exit 0
            fi
            sleep 1
          done
          echo "the container never became ready"
          docker logs construx-ci
          exit 1
