<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CONSTRUX — Construction Operating System</title>
<meta name="description" content="One data spine from concept to thirty years of operation.">

<!-- Matches manifest background_color exactly. A different value here shows as
     a flash between the operating system's launch screen and the page. -->
<meta name="theme-color" content="#0c0c0e">
<meta name="color-scheme" content="dark">

<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">

<!-- iOS installs from Safari's share sheet rather than through the manifest,
     and needs its own instructions. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CONSTRUX">

<!-- Launch images, generated by tools/icons.mjs. iOS shows nothing unless the
     dimensions match a real device exactly, which is why these are enumerated
     rather than derived. Regenerate both with `node tools/icons.mjs`. -->
<link rel="apple-touch-startup-image" href="/icons/launch-1290x2796.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="/icons/launch-1179x2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="/icons/launch-1284x2778.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="/icons/launch-1170x2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="/icons/launch-1125x2436.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="/icons/launch-1242x2688.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="/icons/launch-828x1792.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="/icons/launch-750x1334.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="/icons/launch-2048x2732.png" media="(device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="/icons/launch-1668x2388.png" media="(device-width: 834px) and (device-height: 1194px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="/icons/launch-1668x2224.png" media="(device-width: 834px) and (device-height: 1112px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="/icons/launch-1536x2048.png" media="(device-width: 768px) and (device-height: 1024px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">

<link rel="stylesheet" href="/app.css">
</head>
<body>
  <!--
    The splash.

    It is in the document rather than drawn by the application, so it is painted
    from the first byte of HTML — before app.js parses, before any request goes
    out. That is the whole point: it takes over from the operating system's own
    launch screen with the same background and the same mark, so the handover is
    invisible, and it stays up until the first real screen is ready.

    It is removed by app.js once a view has drawn. If the application fails to
    start, the message below changes rather than the splash sitting there
    implying progress that is not happening.
  -->
  <div id="splash" class="splash" role="status" aria-live="polite">
    <!-- Geometry matches frontend/logo-glyph.svg and the generated launch
         images. The launch image and this splash have to be the same mark at
         the same proportion or the handover from the operating system's screen
         to ours visibly jumps. -->
    <svg class="splash-mark" viewBox="0 0 64 64" role="img" aria-label="CONSTRUX">
      <path fill="#6b727b" d="M12 14 L22 9 L22 40 L12 40 Z"/>
      <path fill="#8b939d" d="M24 12 L31 8 L31 40 L24 40 Z"/>
      <path fill="#6b727b" d="M30 30 L38 30 L45 40 L41 45 Z"/>
      <path fill="#6b727b" d="M43 38 L50 38 L56 52 L47 52 Z"/>
      <path fill="#ff6600" d="M45 30 L56 30 L41 52 L31 52 Z"/>
    </svg>
    <div class="splash-word">CONSTRU<span>X</span></div>
    <div class="splash-note" id="splash-note">Starting the operating system…</div>
    <div class="splash-bar"><i></i></div>
  </div>

  <div id="root"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
